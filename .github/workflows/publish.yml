# NPM Publish is the name for this action
name: NPM Publish

# This action will publish to NPM on every new release
on:
    release:
        types: [created]

# Job will run on a ubuntu instance
jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            # Checkout the code
            - uses: actions/checkout@v4
            # Setup node with version 20.x and NPM registry url
            - uses: actions/setup-node@v4
              with:
                  node-version: '22.x'
                  registry-url: 'https://registry.npmjs.org'
            # Run npm install to install project packages
            - run: npm install
            # npm build to build the project
            - run: npm run build
            # Generate SRI hash for the UMD build
            - name: Generate SRI hash
              run: |
                  echo "Generating SRI hash for UMD build..."
                  SRI_HASH="sha384-$(npm run generate-sri --silent)"
                  echo "SRI_HASH=$SRI_HASH" >> $GITHUB_ENV

                  # Create a file with the hash that will be published with the package
                  echo "$SRI_HASH" > build/umd/sri-hash.txt

                  # Also add to release notes
                  echo "## SRI Hash" >> $GITHUB_STEP_SUMMARY
                  echo "For secure CDN usage with this release:" >> $GITHUB_STEP_SUMMARY
                  echo "\`\`\`html" >> $GITHUB_STEP_SUMMARY
                  echo "<script src=\"https://cdn.jsdelivr.net/npm/@rcpch/digital-growth-charts-react-component-library@${{ github.event.release.tag_name }}/build/umd/rcpch-digital-growth-charts.umd.min.js\"" >> $GITHUB_STEP_SUMMARY
                  echo "        integrity=\"$SRI_HASH\"" >> $GITHUB_STEP_SUMMARY
                  echo "        crossorigin=\"anonymous\"></script>" >> $GITHUB_STEP_SUMMARY
                  echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            # publish the files to NPM
            - run: npm publish --access public
              # for publishing, npm need authorization. We add the NPM token to the environment which will take care of authorization to publish to the package
              env:
                  NODE_AUTH_TOKEN: ${{secrets.NPM_TOKEN}}
