# Chromatic recommend having this on "push" so we have it as a separate workflow
# https://www.chromatic.com/docs/github-actions/#recommended-configuration-for-build-events

name: "Chromatic"

on: push

jobs:
  chromatic:
    name: Run Chromatic
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v6
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Run Chromatic
        uses: chromaui/action@d92ea1ce501f70e8c34745b2c7888648150a368a # latest
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          exitZeroOnChanges: true
          exitOnceUploaded: true