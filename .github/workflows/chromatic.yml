# Chromatic recommend having this on "push" so we have it as a separate workflow
# https://www.chromatic.com/docs/github-actions/#recommended-configuration-for-build-events

name: "Chromatic"

on: push

jobs:
  chromatic:
    name: Run Chromatic
    runs-on: ubuntu-latest
    # Dependabot-triggered runs cannot access repository secrets, so
    # CHROMATIC_PROJECT_TOKEN is empty and the action fails with
    # "Missing project token". These failures are noise unrelated to any
    # visual change, so skip Chromatic on Dependabot runs.
    if: github.actor != 'dependabot[bot]'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Run Chromatic
        uses: chromaui/action@534eebfc19023579541d106f7b61d5ad70ed65c7 # latest
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          exitZeroOnChanges: true
          exitOnceUploaded: true