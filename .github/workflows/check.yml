name: Check build and tests on PR and merge to live

on:
    pull_request:
        branches:
            - '*'
    push:
        branches:
            - live

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v6
            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v6
              with:
                  node-version: '22.x'
                  registry-url: 'https://registry.npmjs.org'
            - run: npm install
            - run: npm run build
            - run: npm test
